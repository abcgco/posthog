#
# `docker-compose` file used ONLY for hobby deployments.
#
# Please take a look at https://posthog.com/docs/self-host/deploy/hobby
# for more info.
#
# PostHog has sunset support for self-hosted K8s deployments.
# See: https://posthog.com/blog/sunsetting-helm-support-posthog
#

x-logging: &default-logging
    driver: json-file
    options:
        max-size: '50m'
        max-file: '3'

services:
    db:
        extends:
            file: docker-compose.base.yml
            service: db
        restart: always
        image: ${DOCKER_REGISTRY_PREFIX:-}postgres:15.12-alpine
        volumes:
            - postgres-data:/var/lib/postgresql/data

    redis7:
        extends:
            file: docker-compose.base.yml
            service: redis7
        restart: always
        volumes:
            - redis7-data:/data

    clickhouse:
        #
        # Note: please keep the default version in sync across
        #       `posthog` and the `charts-clickhouse` repos
        #
        extends:
            file: docker-compose.base.yml
            service: clickhouse
        restart: always
        depends_on:
            - kafka
            - zookeeper
        volumes:
            - ./posthog/idl:/idl
            - ./docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
            - ./docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
            - ./docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
            - ./docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
            - ./docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
            - ./posthog/user_scripts:/var/lib/clickhouse/user_scripts
            - clickhouse-data:/var/lib/clickhouse

    zookeeper:
        extends:
            file: docker-compose.base.yml
            service: zookeeper
        restart: always
        environment:
            ZOO_AUTOPURGE_PURGEINTERVAL: 1
            ZOO_AUTOPURGE_SNAPRETAINCOUNT: 3
        volumes:
            - zookeeper-datalog:/datalog
            - zookeeper-data:/data
            - zookeeper-logs:/logs
    kafka:
        extends:
            file: docker-compose.base.yml
            service: kafka
        restart: always
        depends_on:
            - zookeeper
        environment:
            KAFKA_LOG_RETENTION_MS: 3600000
            KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
            KAFKA_LOG_RETENTION_HOURS: 1
        volumes:
            - kafka-data:/bitnami/kafka

    worker:
        extends:
            file: docker-compose.base.yml
            service: worker
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENABLED: true
            RECORDING_API_URL: http://recording-api:6738
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            POSTHOG_SKIP_MIGRATION_CHECKS: '1'
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://$DOMAIN
            PERSONHOG_ADDR: 'personhog-router:50052'
            PERSONHOG_ENABLED: 'true'
            BROWSERLESS_CDP_URL: 'ws://browserless:3000'
            BROWSERLESS_TOKEN: ${BROWSERLESS_SECRET:-$POSTHOG_SECRET}
            HEATMAP_BROWSERLESS_URL: 'http://browserless:3000'
            HEATMAP_BROWSERLESS_TOKEN: ${BROWSERLESS_SECRET:-$POSTHOG_SECRET}
            FEATURE_FLAGS_SERVICE_URL: 'http://feature-flags:3001'
            CLICKHOUSE_LOGS_CLUSTER_HOST: 'clickhouse'
            CLICKHOUSE_LOGS_CLUSTER_SECURE: 'false'
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        depends_on:
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy
            clickhouse:
                condition: service_started
            kafka:
                condition: service_healthy
            web:
                condition: service_started
            personhog-router:
                condition: service_started
            browserless:
                condition: service_started
    web:
        extends:
            file: docker-compose.base.yml
            service: web
        command: /compose/start
        volumes:
            - ./compose:/compose
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        environment:
            SITE_URL: https://$DOMAIN
            LIVESTREAM_HOST: 'https://${DOMAIN}/livestream'
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            OBJECT_STORAGE_ENABLED: true
            RECORDING_API_URL: http://recording-api:6738
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            OTEL_SERVICE_NAME: 'posthog'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
            OTEL_SDK_DISABLED: 'true'
            USE_GRANIAN: 'true'
            GRANIAN_WORKERS: '2'
            OPT_OUT_CAPTURE: ${OPT_OUT_CAPTURE:-true}
            POSTHOG_SKIP_MIGRATION_CHECKS: ${POSTHOG_SKIP_MIGRATION_CHECKS:-}
            PERSISTED_FEATURE_FLAGS: 'web-experiments'
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://$DOMAIN
            DEPLOYMENT: 'hobby'
            PERSONHOG_ADDR: 'personhog-router:50052'
            PERSONHOG_ENABLED: 'true'
            FEATURE_FLAGS_SERVICE_URL: 'http://feature-flags:3001'
            CLICKHOUSE_LOGS_CLUSTER_HOST: 'clickhouse'
            CLICKHOUSE_LOGS_CLUSTER_SECURE: 'false'
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - personhog-router

    plugins:
        extends:
            file: docker-compose.base.yml
            service: plugins
        image: ${REGISTRY_URL}:node
        volumes:
            - ./share:/share
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            OBJECT_STORAGE_ACCESS_KEY_ID: 'object_storage_root_user'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'object_storage_root_password'
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: 120000
            OBJECT_STORAGE_ENDPOINT: http://objectstorage:19000
            OBJECT_STORAGE_PUBLIC_ENDPOINT: https://$DOMAIN
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            OBJECT_STORAGE_ENABLED: true
            CDP_REDIS_HOST: redis7
            CDP_REDIS_PORT: 6379
            LOGS_REDIS_HOST: redis7
            LOGS_REDIS_PORT: 6379
            LOGS_REDIS_TLS: 'false'
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
            CYCLOTRON_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'
            OTEL_EXPORTER_OTLP_ENDPOINT: ''
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs

    ingestion-general:
        command: node nodejs/dist/index.js
        image: ${REGISTRY_URL}:node
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-v2-combined'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            BEHAVIORAL_COHORTS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CLICKHOUSE_HOST: 'clickhouse'
            CLICKHOUSE_DATABASE: 'posthog'
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            COOKIELESS_REDIS_HOST: redis7
            COOKIELESS_REDIS_PORT: 6379
            CDP_REDIS_HOST: redis7
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka

    ingestion-sessionreplay:
        command: node nodejs/dist/index.js
        image: ${REGISTRY_URL}:node
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'recordings-blob-ingestion-v2'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            SESSION_RECORDING_V2_S3_ACCESS_KEY_ID: 'any'
            SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY: 'any'
            SESSION_RECORDING_V2_S3_TIMEOUT_MS: 120000
            SESSION_RECORDING_V2_S3_ENDPOINT: http://seaweedfs:8333
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
        depends_on:
            - db
            - redis7
            - kafka
            - seaweedfs

    ingestion-error-tracking:
        command: node nodejs/dist/index.js
        image: ${REGISTRY_URL}:node
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-errortracking'
            # HOS-50tp (09.08.2026): апстримовский hobby-компоуз отстал от новой
            # архитектуры error tracking, и обе стороны разъехались по умолчаниям.
            # 1) capture пишет исключения в error_tracking_events (rust/capture/src/config.rs,
            #    envconfig default), а этот потребитель по умолчанию читает
            #    ingestion-errortracking-main, куда никто никогда не писал: 0 сообщений.
            # 2) ERROR_TRACKING_CYMBAL_BASE_URL по умолчанию localhost:3302, то есть сам
            #    контейнер потребителя, а не соседний сервис cymbal.
            # Итог до правки: с 03.08 каждый краш и каждое серверное исключение молча
            # копились в Kafka и не доходили ни до ClickHouse, ни до интерфейса.
            ERROR_TRACKING_CONSUMER_CONSUME_TOPIC: 'error_tracking_events'
            ERROR_TRACKING_CYMBAL_BASE_URL: 'http://cymbal:3302'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            CDP_REDIS_HOST: redis7
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-logs:
        command: node nodejs/dist/index.js
        image: ${REGISTRY_URL}:node
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-logs'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            LOGS_REDIS_HOST: redis7
            CDP_REDIS_HOST: redis7
            ENCRYPTION_SALT_KEYS: $ENCRYPTION_SALT_KEYS
        depends_on:
            - db
            - redis7
            - kafka

    ingestion-traces:
        command: node nodejs/dist/index.js
        image: ${REGISTRY_URL}:node
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'ingestion-traces'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
            REDIS_URL: 'redis://redis7:6379/'
            TRACES_REDIS_HOST: redis7
        depends_on:
            - db
            - redis7
            - kafka

    personhog-replica:
        image: ${REGISTRY_URL}:personhog-replica
        restart: on-failure
        logging: *default-logging
        environment:
            GRPC_ADDRESS: '0.0.0.0:50051'
            PRIMARY_DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            RUST_LOG: 'info'
            METRICS_PORT: '9100'
        depends_on:
            db:
                condition: service_healthy

    personhog-router:
        image: ${REGISTRY_URL}:personhog-router
        restart: on-failure
        logging: *default-logging
        environment:
            GRPC_ADDRESS: '0.0.0.0:50052'
            REPLICA_URL: 'http://personhog-replica:50051'
            BACKEND_TIMEOUT_MS: '5000'
            RUST_LOG: 'info'
            METRICS_PORT: '9101'
        depends_on:
            - personhog-replica

    hypercache-server:
        image: ${REGISTRY_URL}:hypercache-server
        restart: on-failure
        logging: *default-logging
        environment:
            REDIS_URL: 'redis://redis7:6379/'
            ADDRESS: '0.0.0.0:3002'
            RUST_LOG: 'info'
        depends_on:
            - redis7

    browserless:
        image: ghcr.io/browserless/chromium:v2.51.2
        restart: on-failure
        logging: *default-logging
        environment:
            TOKEN: ${BROWSERLESS_SECRET:-$POSTHOG_SECRET}

    recording-api:
        command: node nodejs/dist/index.js
        image: ${REGISTRY_URL}:node
        restart: on-failure
        logging: *default-logging
        environment:
            PLUGIN_SERVER_MODE: 'recording-api'
            PERSONHOG_ENABLED: 'true'
            PERSONHOG_ADDR: 'personhog-router:50052'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            REDIS_URL: 'redis://redis7:6379/'
            CLICKHOUSE_HOST: 'clickhouse'
            CLICKHOUSE_DATABASE: 'posthog'
            CLICKHOUSE_SECURE: 'false'
            CLICKHOUSE_VERIFY: 'false'
            SESSION_RECORDING_API_REDIS_HOST: redis7
            SESSION_RECORDING_API_REDIS_PORT: 6379
        depends_on:
            - db
            - redis7
            - clickhouse

    proxy:
        extends:
            file: docker-compose.base.yml
            service: proxy
        volumes:
            - caddy-data:/data
            - caddy-config:/config
        environment:
            CADDY_TLS_BLOCK: "auto_https off"
            CADDY_HOST: ':80'
        networks:
            - default
            - web
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.posthog.rule=Host(`${DOMAIN}`)"
            - "traefik.http.routers.posthog.entrypoints=websecure"
            - "traefik.http.routers.posthog.tls.certresolver=letsencrypt"
            - "traefik.http.services.posthog.loadbalancer.server.port=80"
            - "traefik.docker.network=web"
        depends_on:
            - web
            - livestream
    objectstorage:
        extends:
            file: docker-compose.base.yml
            service: objectstorage

        restart: on-failure
        volumes:
            - objectstorage:/data
        ports:
            - '127.0.0.1:19000:19000'
            - '127.0.0.1:19001:19001'

    seaweedfs:
        extends:
            file: docker-compose.base.yml
            service: seaweedfs
        restart: on-failure
        volumes:
            - seaweedfs:/data
        healthcheck:
            test:
                [
                    'CMD',
                    'sh',
                    '-c',
                    "echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog",
                ]
            interval: 5s
            timeout: 10s
            retries: 30
            start_period: 10s

    asyncmigrationscheck:
        extends:
            file: docker-compose.base.yml
            service: asyncmigrationscheck
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            SKIP_ASYNC_MIGRATIONS_SETUP: 0

    # Temporal containers
    temporal:
        extends:
            file: docker-compose.base.yml
            service: temporal
        environment:
            - ENABLE_ES=false
        volumes:
            - ./docker/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig
    elasticsearch:
        extends:
            file: docker-compose.base.yml
            service: elasticsearch
    temporal-admin-tools:
        extends:
            file: docker-compose.base.yml
            service: temporal-admin-tools
        depends_on:
            - temporal
    temporal-ui:
        extends:
            file: docker-compose.base.yml
            service: temporal-ui
        depends_on:
            temporal:
                condition: service_started
            db:
                condition: service_healthy
    temporal-django-worker:
        command: /compose/temporal-django-worker
        extends:
            file: docker-compose.base.yml
            service: temporal-django-worker
        volumes:
            - ./compose:/compose
        image: $REGISTRY_URL:$POSTHOG_APP_TAG
        environment:
            SITE_URL: https://$DOMAIN
            SECRET_KEY: $POSTHOG_SECRET
            FEATURE_FLAGS_SERVICE_URL: 'http://feature-flags:3001'
            CLICKHOUSE_LOGS_CLUSTER_HOST: 'clickhouse'
            CLICKHOUSE_LOGS_CLUSTER_SECURE: 'false'
            BROWSERLESS_CDP_URL: 'ws://browserless:3000'
            BROWSERLESS_TOKEN: ${BROWSERLESS_SECRET:-$POSTHOG_SECRET}
            HEATMAP_BROWSERLESS_URL: 'http://browserless:3000'
            HEATMAP_BROWSERLESS_TOKEN: ${BROWSERLESS_SECRET:-$POSTHOG_SECRET}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
        depends_on:
            - db
            - redis7
            - clickhouse
            - kafka
            - objectstorage
            - seaweedfs
            - temporal
            - browserless

    cyclotron-janitor:
        extends:
            file: docker-compose.base.yml
            service: cyclotron-janitor
        build:
            context: ./rust
        environment:
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            KAFKA_HOSTS: 'kafka:9092'
        depends_on:
            db:
                condition: service_healthy
            kafka:
                condition: service_started

    capture:
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: capture

    replay-capture:
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: replay-capture

    property-defs-rs:
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: property-defs-rs
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            db:
                condition: service_healthy

    livestream:
        extends:
            file: docker-compose.base.yml
            service: livestream
        environment:
            - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET}
        volumes:
            - ./docker/livestream/configs-hobby.yml:/configs/configs.yml

    feature-flags:
        build:
            context: ./rust
        extends:
            file: docker-compose.base.yml
            service: feature-flags
        depends_on:
            - db
            - redis7

    kafka-init:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        entrypoint: /bin/sh
        command:
            - -c
            - |
                set -x
                echo "Waiting for Kafka broker to accept connections..."
                TIMEOUT=60
                ELAPSED=0
                # Use rpk topic list as the readiness check - it's a simple operation
                # that confirms the broker is accepting Kafka protocol requests
                until rpk topic list --brokers kafka:9092 2>/dev/null; do
                    echo "Kafka broker not ready yet (elapsed: ${ELAPSED}s)..."
                    sleep 2
                    ELAPSED=$((ELAPSED + 2))
                    if [ $ELAPSED -ge $TIMEOUT ]; then
                        echo "Timeout waiting for Kafka broker after ${TIMEOUT}s"
                        echo "Final attempt to list topics:"
                        rpk topic list --brokers kafka:9092 || true
                        exit 1
                    fi
                done
                echo "Kafka broker is accepting requests, creating topics..."
                # Create topics needed by rust services
                # Note: $$ escapes $ for docker-compose variable substitution
                for topic in exceptions_ingestion clickhouse_events_json; do
                    if rpk topic create "$$topic" --brokers kafka:9092 -p 1 -r 1 2>&1; then
                        echo "Topic $$topic created successfully"
                    else
                        if rpk topic list --brokers kafka:9092 | grep -q "$$topic"; then
                            echo "Topic $$topic already exists, continuing"
                        else
                            echo "Failed to create topic $$topic"
                            exit 1
                        fi
                    fi
                done
                echo "Final topic list:"
                rpk topic list --brokers kafka:9092
                echo "Topics ready"
        depends_on:
            kafka:
                condition: service_healthy

    cymbal:
        image: ${REGISTRY_URL}:cymbal
        build:
            context: ./rust
            args:
                BIN: cymbal
        restart: on-failure
        volumes:
            - ./share:/share
        environment:
            KAFKA_HOSTS: 'kafka:9092'
            KAFKA_CONSUMER_GROUP: cymbal
            KAFKA_CONSUMER_TOPIC: exceptions_ingestion
            OBJECT_STORAGE_BUCKET: posthog
            OBJECT_STORAGE_ACCESS_KEY_ID: 'any'
            OBJECT_STORAGE_SECRET_ACCESS_KEY: 'any'
            OBJECT_STORAGE_ENDPOINT: 'http://seaweedfs:8333'
            OBJECT_STORAGE_FORCE_PATH_STYLE: 'true'
            BIND_HOST: '0.0.0.0'
            BIND_PORT: '3302'
            DATABASE_URL: 'postgres://posthog:posthog@db:5432/posthog'
            PERSONS_URL: 'postgres://posthog:posthog@db:5432/posthog'
            MAXMIND_DB_PATH: '/share/GeoLite2-City.mmdb'
            REDIS_URL: 'redis://redis7:6379/'
            ISSUE_BUCKETS_REDIS_URL: 'redis://redis7:6379/'
            RUST_LOG: 'info'
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            seaweedfs:
                condition: service_healthy
            db:
                condition: service_healthy
            redis7:
                condition: service_healthy

volumes:
    zookeeper-data:
    zookeeper-datalog:
    zookeeper-logs:
    objectstorage:
    seaweedfs:
    postgres-data:
    clickhouse-data:
    caddy-data:
    caddy-config:
